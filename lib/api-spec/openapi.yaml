openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assistant
    description: Parent Decoder AI assistant operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /assistant/respond:
    post:
      operationId: respondWithAssistant
      tags: [assistant]
      summary: Ask the Parent Decoder AI assistant a question
      description: |
        Returns a contextual explanation or answer from the Parent Decoder
        assistant. Requests are processed without creating a saved conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantRequest"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Assistant provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AssistantRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [explain, chat]
        message:
          type: string
          minLength: 1
          maxLength: 1200
        context:
          type: string
          maxLength: 600
      required:
        - mode
        - message
    AssistantResponse:
      type: object
      properties:
        answer:
          type: string
        mode:
          type: string
          enum: [explain, chat]
        privacyNote:
          type: string
      required:
        - answer
        - mode
        - privacyNote
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

